<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Can I Park Here</title>
</head>
<body>
  <h1>Can I Park Here</h1>
  <input id="file" type="file" accept="image/*">
  <p id="status"></p>
  <pre id="out"></pre>
  <script type="module">
    import { shrinkPhoto, readPhoto } from "/js/photo.js";
    const status = document.getElementById("status");
    const out = document.getElementById("out");
    document.getElementById("file").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      try {
        status.textContent = "Reading signs...";
        const { dataUrl } = await shrinkPhoto(file);
        const result = await readPhoto(dataUrl);
        status.textContent = `${result.signs.length} signs (${result.model}, ${result.ms} ms)`;
        out.textContent = result.signs.map((s) =>
          `${s.id}. ${s.text} [arrow ${s.arrow}] ${s.readable ? "" : "NOT SURE: " + s.problem}\n   ` +
          s.rules.map((r) => `${r.kind} ${r.days.join(",")} ${r.start}-${r.end}`).join("\n   ")).join("\n");
      } catch (err) {
        status.textContent = "Couldn't read this photo right now. (" + err.message + ")";
      }
    });
  </script>
</body>
</html>
